[project]
name = "meetrec"
version = "0.1.0"
description = "Record Slack huddles and Google Meet calls on this machine and transcribe them with speaker names"
requires-python = ">=3.11,<3.13"
dependencies = [
    "senko @ git+https://github.com/narcotic-sh/senko.git",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "faster-whisper>=1.1",
    "numpy",
    "soundfile",
]

[project.scripts]
meetrec = "meetrec.cli:main"

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
