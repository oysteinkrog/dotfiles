[project]
name = "plainlang"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Øystein Krog", email = "oystein.krog@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "wordfreq>=3.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
pl = "plainlang.cli:main"

[tool.pytest.ini_options]
# Without this, running pytest from a host repository's root collects that whole
# repository. In the monorepo that reached a script calling sys.exit(1) at import
# and took the run down with 11 collection errors.
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
