[project]
name = "plainlang"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Øystein Krog", email = "oystein.krog@gmail.com" }
]
requires-python = ">=3.12"
# Scoring uses the standard library only, on purpose. That is what lets a hook
# call this with bare `python3` and a PYTHONPATH, with no virtualenv, no install
# step and no network. wordfreq is needed only to rebuild data/lexicon.tsv.gz,
# which happens when a norm source changes, so it lives in an optional group.
dependencies = []

[project.optional-dependencies]
bake = ["wordfreq>=3.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
pl = "plainlang.cli:main"

[tool.pytest.ini_options]
# Without this, running pytest from a host repository's root collects that whole
# repository. In the monorepo that reached a script calling sys.exit(1) at import
# and took the run down with 11 collection errors.
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
