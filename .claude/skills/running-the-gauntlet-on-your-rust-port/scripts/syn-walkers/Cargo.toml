[package]
name = "syn-walkers"
version = "0.1.0"
edition = "2021"
publish = false
description = "AST-precise surface walkers for the gauntlet skill — predicates that ast-grep cannot express."

[[bin]]
name = "syn-walkers"
path = "src/main.rs"

[dependencies]
syn = { version = "2.0", features = ["full", "parsing", "visit", "extra-traits"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
