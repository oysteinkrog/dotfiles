name: brennerbot-design-review
description: |
  Design-review mode pipeline — A1-archetype investigation of system designs
  with cross-domain imports + scale-physics + adversarial probing.

  Per references/DOMAIN-RECIPE-LIBRARY.md R1 (backend system design).
  Use for: greenfield architecture decisions, migration planning,
  technology-stack evaluations, refactor-vs-rewrite decisions.

inputs:
  workspace: required
  question: required          # one-line summary
  workload_class: required    # specific workload (req/s, data shape, etc)
  scale_horizon: required     # forecast scale at decision horizon

phases:
  - name: phase_0_pre_check
    type: automated
    description: |
      Compose with /codebase-archaeology if existing system; pin code
      with content hash. Compose with /cass for prior decisions.

    actions:
      - if existing_codebase: run codebase-archaeology on the explicit target path and record the content hash
      - dispatch /cass search "<topic>" --robot --limit 10
      - dispatch MO-stress-test-self-check.md with TIER=T3, MODE=design-review, ARCHETYPE=<design archetype>, OPERATOR_NAME=<operator>

  - name: phase_1_framing
    type: manual
    description: |
      Per FRAMING-WORKBOOK.md F1-F9 with R1 emphasis:
      - F2 stakes (reversibility, recovery cost)
      - F3 scope (workload class, time horizon)
      - F8 constraints (technology stack, headcount, compute budget)

    deliverable: intake/question_of_record.md

    self_test:
      - falsifier observable in <1h?
      - scope balloon test (per AE-1.7)
      - decision rule extracted (per subagents/decision-rule-extractor)

  - name: phase_2_bootstrap
    type: automated
    description: |
      Squad tier roster:
      - cc: 3 (Proposer, Investigator-1, Synthesizer)
      - cod: 1 (Investigator-2)
      - gmi: 1 (Devil's-Advocate / Adjudicator)

    dispatch:
      - MO-02-onboarding.md per pane
      - subagents/corpus-curator.md to pin authoritative sources

  - name: phase_3_hypotheses
    type: manual
    description: |
      Generate ≥3 design alternatives including ≥1 third-alternative.
      Each H has explicit mechanism + falsifier + scale-physics.

    dispatch:
      - MO-03a-propose.md (per Proposer)
      - MO-03b-triage.md
      - MO-03c-third-alternative.md (mandatory)
      - MO-cross-domain-import.md (apply ⊕ for buried CS techniques)

    convergence:
      - ≥3 distinct H
      - ≥1 origin:third_alternative
      - confidence diversity (≥2 levels per OC-008)

  - name: phase_4_investigate
    type: manual
    description: |
      Per-H investigation with:
      - ⊞ Scale-Check: each H scaled at current + 10× + 100×
      - ⊕ Cross-Domain: queue theory / CAP / erasure coding patterns
      - ✂ Exclusion-Test: falsifier-firing per H per round
      - 🔧 DIY: microbenchmark each finalist

    dispatch:
      - MO-04a-investigate.md (per H, per Investigator)
      - MO-04b-devils-advocate.md (cross-family)
      - MO-quickie-pilot.md (preferred for cheap probes)
      - MO-cross-family-debate.md if F-403 detected

    convergence_check: convergence-check.sh --phase=4 --workspace=${workspace}

  - name: phase_5_adjudicate
    type: manual
    description: |
      Cross-family debates per H. Adjudicator rotation enforced.
      ⊘ Level-Split for hybrid designs.

    dispatch:
      - MO-05a-cross-exam.md (per H pair)
      - MO-05b-adjudicate.md (cross-family adjudicator)
      - MO-debate-deadlock-resolution.md if deadlock detected

    rotation_check: check-rotation-rules.sh --workspace=${workspace}

  - name: phase_6_distill
    type: manual
    description: |
      Per-family distillation with R1 emphasis:
      - 𝓛 Recode each design's invariants
      - ≡ Extract scale-physics invariants per design
      - ⊕ Surface cross-family disagreements on extrapolation

    dispatch:
      - MO-06a-distill.md per family
      - MO-06b-meta-synthesize.md
      - subagents/evidence-grader.md (rescore W axes)

    convergence_check: convergence-check.sh --phase=6 --workspace=${workspace}
    lint: disagreement-register-lint.sh

  - name: phase_7_audit
    type: manual
    description: |
      Standard fresh-eyes trio + R1-specific:
      - ⊞ Re-verify scale-physics calculations (per OC-021)
      - ⊕ Cross-domain blind spots (did we miss queue-theory? CAP? etc)

    dispatch:
      - MO-07a-fresh-eyes.md (cross-family)
      - subagents/red-team.md if T4+
      - subagents/falsifier-grader.md

    six_layer_check: check-six-layer-validation.sh

  - name: phase_8_freeze
    type: manual
    description: Standard. RESUME.md + checkpoint export.

  - name: phase_9_handback
    type: manual
    description: |
      DECISION-MEMO.md per assets/templates/decision-memo-template.md.
      Include reversibility analysis + dissent + risk register.
      ≤80 lines per HANDBACK-VOICE-GUIDE.md.

    deliverable: deliverables/DECISION-MEMO.md

    voice_check: per HANDBACK-VOICE-GUIDE.md (R1 anti-patterns)

  - name: phase_10_drift
    type: manual
    description: |
      Standard fresh-agent drift check + R1-specific:
      - Did we cross-domain import enough?
      - Did we test scale-physics rigorously?
      - Did we treat the design as orthogonal H per concern?

outputs:
  - deliverables/HANDBACK.md
  - deliverables/DECISION-MEMO.md
  - deliverables/RESUME.md
  - distillations/disagreement_register.md
  - audit-findings/

wall_time_estimate:
  T2: 3-5h
  T3: 5-8h
  T4: 1-3 days

anti_patterns:
  - Skip ⊞ Scale-Check (designs that work at toy scale fail at production)
  - Skip cross-domain ⊕ import (locks swarm into consensus answers)
  - Treat design as one big blob H (decompose into orthogonal H per concern)
  - Skip quickie pilots (3h flagship investigations 5× more expensive)
  - Same-family adjudicator (per F-501)
