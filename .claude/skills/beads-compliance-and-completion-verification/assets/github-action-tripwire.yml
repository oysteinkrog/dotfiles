# .github/workflows/beads-audit-tripwire.yml
#
# Daily tripwire for the beads compliance audit.
# Generated by `beads-compliance-and-completion-verification` skill.
#
# What it does:
#   - Runs every weekday at 06:00 UTC + on every push to main.
#   - Clones the project (this repo) AND a SEPARATE audit-history repo.
#     The audit-history repo is checked out INTO the project tree at the
#     canonical local path `<project>/beads_compliance_audit/`.
#   - Executes a single audit pass against HEAD with policy=report-only
#     (tripwire mode never writes back to the bead store).
#   - Compares to the prior pass; if convergence broke OR new false-closed
#     beads appeared, opens / updates a tracking GitHub issue and posts a
#     summary as a step annotation.
#   - Exit non-zero on regression so the workflow fails (the page is
#     "convergence broke" by default; loosen with `continue-on-error: true`).
#
# Setup:
#   1. Copy this to .github/workflows/beads-audit-tripwire.yml in your project.
#   2. Create a separate audit-history repo (e.g. github.com/<you>/<project>-beads-audit).
#   3. Add a deploy key + secret AUDIT_REPO_KEY (read/write) for that repo.
#   4. Optionally add SLACK_WEBHOOK_URL secret for notifications.
#
# This template is OPINIONATED. Override env vars at the workflow level.
#
name: beads-audit-tripwire

on:
  schedule:
    - cron: '0 6 * * 1-5'           # 06:00 UTC, weekdays
  push:
    branches: [main]
  workflow_dispatch:                  # manual trigger
    inputs:
      mode:
        description: 'audit mode'
        type: choice
        options: [tripwire, standard, comprehensive]
        default: tripwire

permissions:
  contents: read
  issues: write

env:
  THRESHOLD: '700'
  AUDIT_REPO: '${{ github.repository_owner }}/${{ github.event.repository.name }}-beads-audit'
  AUDIT_BRANCH: main
  POLICY: report-only

concurrency:
  group: beads-audit-${{ github.ref }}
  cancel-in-progress: false           # never cancel a running audit; always finish

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0              # full history for git-blame / git-log lookups

      - name: Checkout audit dir
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AUDIT_REPO }}
          path: beads_compliance_audit
          ssh-key: ${{ secrets.AUDIT_REPO_KEY }}
          fetch-depth: 0

      - name: Install audit toolchain
        run: |
          set -euo pipefail
          # Tools the skill's scripts depend on.
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq ripgrep python3-yaml
          # Install br (beads_rust). Replace with your install method.
          curl -fsSL https://github.com/Dicklesworthstone/beads_rust/releases/latest/download/br-linux-x86_64 \
            -o /usr/local/bin/br
          chmod +x /usr/local/bin/br
          br --version
          # Install the skill (or vendor it under .claude/skills/ in the project).
          if [ ! -d .claude/skills/beads-compliance-and-completion-verification ]; then
            mkdir -p .claude/skills
            git clone --depth 1 https://github.com/<you>/skills-repo /tmp/skills
            cp -r /tmp/skills/.claude/skills/beads-compliance-and-completion-verification .claude/skills/
          fi

      - name: Run audit pass (tripwire)
        id: audit
        env:
          MODE: ${{ github.event.inputs.mode || 'tripwire' }}
        run: |
          set -euo pipefail
          # `--audit-dir` is set explicitly so bootstrap re-uses the audit-
          # history checkout from the prior step (rather than initializing a
          # fresh empty directory). The path here matches the local default
          # `<project>/beads_compliance_audit/` for clarity.
          .claude/skills/beads-compliance-and-completion-verification/scripts/run-pass.sh \
            "$PWD" \
            --threshold "$THRESHOLD" \
            --mode "$MODE" \
            --policy "$POLICY" \
            --audit-dir "$PWD/beads_compliance_audit" \
            2>&1 | tee audit.log
          # Surface the pass dir for downstream steps.
          PASS_DIR="$(ls -1d beads_compliance_audit/passes/*/ | sort | tail -1)"
          echo "pass_dir=$PASS_DIR" >> "$GITHUB_OUTPUT"

      - name: Validate audit dir integrity
        run: |
          python3 .claude/skills/beads-compliance-and-completion-verification/scripts/validate-audit-dir.py \
            beads_compliance_audit

      - name: Diff vs prior pass
        id: diff
        run: |
          set -euo pipefail
          if [ "$(ls beads_compliance_audit/passes | wc -l)" -ge 2 ]; then
            .claude/skills/beads-compliance-and-completion-verification/scripts/diff-passes.sh \
              beads_compliance_audit > pass_diff.md
            cat pass_diff.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "First pass — no prior to diff against." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Detect regression
        id: regression
        run: |
          set -euo pipefail
          # convergence.json#is_converged false → regression
          PASS_DIR="${{ steps.audit.outputs.pass_dir }}"
          if [ -f "$PASS_DIR/convergence.json" ]; then
            CONV="$(jq -r '.is_converged' "$PASS_DIR/convergence.json")"
            if [ "$CONV" != "true" ]; then
              echo "regressed=true" >> "$GITHUB_OUTPUT"
              jq -r '.criteria, .next_pass_tasks[]?' "$PASS_DIR/convergence.json" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo "regressed=false" >> "$GITHUB_OUTPUT"

      - name: Commit audit pass to sibling repo
        if: always()
        working-directory: beads_compliance_audit
        run: |
          set -euo pipefail
          git config user.name "beads-audit-tripwire[bot]"
          git config user.email "beads-audit-tripwire@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "tripwire pass $(date -u +%Y-%m-%dT%H-%M-%SZ)"
          git push origin "$AUDIT_BRANCH"

      - name: Open / update tracking issue on regression
        if: steps.regression.outputs.regressed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = '🚨 beads audit: convergence broke / new false-closed';
            const issues = await github.rest.issues.listForRepo({owner, repo, labels: 'audit-tripwire', state: 'open'});
            const body = `Tripwire run failed: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}\n\nSee step summary for the diff.`;
            if (issues.data.length === 0) {
              await github.rest.issues.create({owner, repo, title, body, labels: ['audit-tripwire', 'priority/p1']});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number: issues.data[0].number, body});
            }

      - name: Post Slack notification on regression
        if: steps.regression.outputs.regressed == 'true' && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"🚨 beads audit tripwire failed for $GITHUB_REPOSITORY — see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Fail the workflow if regression detected
        if: steps.regression.outputs.regressed == 'true'
        run: exit 1
