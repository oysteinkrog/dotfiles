# Session classes for this machine. Read by `machine-session` and `heavy-build`.
#
# Classes:
#   critical  never paused, not even with --force.
#   normal    the default. Paused only with `machine-session pause --force`.
#   pausable  may be paused with `machine-session pause`. Its heavy-build
#             builds default to HEAVY_BUILD_PRIORITY=low.
#
# A session is matched in this order:
#   1. its Claude session name (as shown in ~/.claude/sessions/<pid>.json and
#      by `machine-session list`), in [sessions];
#   2. the grove lane tag of its working directory, in [lanes];
#   3. ephemeral_lanes, when that lane is a grove ephemeral lane (made with
#      `grove new --ephemeral` or `grove fork --ephemeral`, so its grove
#      registry entry has an expires_at);
#   4. default.
#
# Oystein confirms every class change. A session may propose one, but only
# Oystein edits this file.

default = "normal"

# Decided by Oystein on 2026-10-09.
ephemeral_lanes = "pausable"

[sessions]
manager-machine = "critical"
# Named here so they stay normal even if they move into an ephemeral lane.
manager-CI = "normal"
manager-CTO = "normal"
kpp = "normal"

# Grove lane tag = class. The tag is the grove project whose path holds the
# session's working directory, for example "kpp" for ~/work/desktop/kpp.
[lanes]
