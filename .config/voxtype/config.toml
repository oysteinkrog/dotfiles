# Voxtype dictation. Tap Right Ctrl to start, speak, tap Right Ctrl again to stop.
# Full option list: https://github.com/peteonrails/voxtype/blob/main/docs/CONFIGURATION.md
# Setup notes: ~/work/life/docs/computers/voice-typing.md

engine = "cohere"
state_file = "auto"

# Patched build (localbuild recipe voxtype): the model runs in a worker process
# that exits after each recording, so the daemon stays at about 25 MB.
engine_isolation = true
# Live text while you speak (Parakeet streaming on the CPU), shown in the overlay.
# The final text comes from Cohere, loaded in the background meanwhile.
live_preview_model = "parakeet-unified-en-0.6b-int8"
# Type the live words into the focused app too, like Claude Code's /voice. On stop,
# Cohere's text replaces them. Needs toggle mode: letters typed while Ctrl is held
# would become shortcuts.
live_typing = false
# Keep a worker with the preview model loaded for 5 minutes after each recording,
# so the next one starts typing about 1.6 s sooner. Costs about 1 GB RAM (no VRAM)
# during those 5 minutes only. 0 = load fresh every time.
live_preview_warm_secs = 300
# Give that 1 GB back early when the machine is under memory pressure (checked every 10 s).
live_preview_warm_release_command = "grep -qE 'level=(slow|pause)' ~/.local/state/pressure/level"

[hotkey]
key = "RIGHTCTRL"
modifiers = []
mode = "toggle"
cancel_key = "ESC"
# Double tap Right Ctrl to start and to stop (patched build). Right Ctrl
# stays free for shortcuts: a tap only counts if no other key is pressed
# while it is down, and each tap and the gap between them are under 300 ms.
double_tap = true
double_tap_ms = 300

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 300

[audio.feedback]
enabled = true
volume = 0.5

# Cohere Transcribe 2B, 4-bit weights: about 2.2 GiB VRAM while a recording runs.
# on_demand_loading must stay false for the live preview: the daemon then holds
# only the small worker launcher, and the worker loads the model per recording.
[cohere]
model = "cohere-transcribe-q4f16"
language = "en"
on_demand_loading = false

# Fast alternative: about 0.4 GiB VRAM, roughly 3x faster.
# Switch with: voxtype record start --model parakeet-tdt-0.6b-v3-int8
[parakeet]
model = "parakeet-tdt-0.6b-v3-int8"
on_demand_loading = true

[whisper]
model = "base.en"
language = "en"
on_demand_loading = true

[output]
# Paste the final text in one keystroke instead of typing it letter by letter.
# Shift+Insert pastes the clipboard in GUI apps and the primary selection in
# terminals (WezTerm/FrankenTerm, Konsole); paste_primary fills both.
# The keystroke goes through dotoold (patched build).
mode = "paste"
paste_keys = "shift+insert"
paste_primary = true
restore_clipboard = true
# After each paste, press Enter if the focused app is listed in
# ~/.config/voxtype/auto-enter-apps (FrankenTerm, so Claude Code sends it).
post_output_command = "$HOME/bin/voxtype-auto-enter"
fallback_to_clipboard = true
type_delay_ms = 0

[output.notification]
on_recording_start = false
on_recording_stop = false
on_transcription = false

[osd]
frontend = "gtk4"
style = "default"
layout = "compact"
# Popup near the middle of the screen (top edge at 45% of the height),
# 25% wider than the 400 px default, preview text 14 pt (theme default ~11).
width_px = 500
top_margin = 0.45
preview_font_pt = 14.0
# Solid background: the see-through panel was hard to read.
opacity = 1.0
