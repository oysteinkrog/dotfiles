# Logitech StreamCam mic: PipeWire volume in software, not on the camera.
#
# The camera's "Mic" gain is a digital multiplier: 30 dB is the raw signal and each
# 6 dB more doubles every sample, so 54 dB is 16 times and clips inside the camera
# (measured 2026-11-16). Chrome's automatic mic gain and the volume slider moved that
# gain during calls. With the soft mixer they change only PipeWire's own volume.
# audio-stall-watchdog holds the camera gain at one fixed value.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.usb-046d_Logitech_StreamCam*" } ]
    actions = { update-props = { api.alsa.soft-mixer = true } }
  }
]
