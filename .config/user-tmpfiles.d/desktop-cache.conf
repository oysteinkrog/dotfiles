# Targets for the symlinks that `desktop-cache apply` puts in ~/.cache.
# Moves KWin/plasmashell mmap and runtime-written caches off btrfs (btrfs_page_mkwrite stalls).
# Plan and undo: ~/bin/desktop-cache, /var/tmp/claude/desktop-cache/PLAN.md
d %t/desktop-cache 0700 - - -
d %t/desktop-cache/nvidia-glcache-0672c47a 0700 - - -
