# plainlang: skip (machine config)
# Candidate dcg 0.15.3 config for Oystein's desktops. Replaces ~/.config/dcg/config.toml.
# Ports the live settings (packs database.postgresql + containers.docker, heredoc scanning on)
# and adds narrow exemptions. Everything not listed here keeps the upstream default.

[general]
color = "auto"
verbose = false
# A command dcg cannot verify (deadline hit under load, or over max_command_bytes) is denied
# with an actionable reason. Default "ask" would stall sessions that have nobody to answer.
unverified_decision = "deny"
# Default budget is 1000 ms. Load average is about 30 on 32 cores, so give it room.
hook_timeout_ms = 3000
# Record every block and warning (one line each).
log_file = "~/.local/share/dcg/blocked.log"
# The installer entry in settings.json is managed by hand (dotfiles). Do not let dcg
# rewrite ~/.claude/settings.json from inside a hook call.
self_heal_hook = false
check_updates = false

[packs]
enabled = [
    "database.postgresql",
    "containers.docker",
]
disabled = []

[heredoc]
enabled = true
timeout_ms = 50
fallback_on_parse_error = true
fallback_on_timeout = true

# History database: off. blocked.log above is enough and cheaper per call.
[history]
enabled = false

[interactive]
enabled = false

# --- Narrow exemptions -------------------------------------------------------

# Only /var/tmp. New files under ~/work and ~/projects rely on 0.15.3's built-in
# carve-out for a literal, absent target whose parent directory exists.
[rules."core.filesystem:redirect-truncate-root-home"]
exempt_target_globs = [
  "/var/tmp/**",
  # 0.15.3 checks every target of a command; a harmless 2>/dev/null next to a /var/tmp
  # redirect otherwise keeps the whole command denied.
  "/dev/null",
  "/dev/stdout",
  "/dev/stderr",
]

[rules."core.filesystem:rm-rf-general"]
exempt_target_globs = [
  "/var/tmp/**",
  "/home/oystein/**/.scratch",
  "/home/oystein/**/.scratch/**",
  "/home/oystein/**/target",
  "/home/oystein/**/target/**",
  "/home/oystein/**/node_modules",
  "/home/oystein/**/node_modules/**",
]

# --- Decision modes ----------------------------------------------------------
# Warn = allow with a stderr note, written to blocked.log (0.15.3).
# Never "ask": tried 2026-10-29 with default_mode = "ask", and every session filled with
# permission prompts. Oystein rejected it the same evening.
[policy.rules]
# 0.15.3 denies these by default; 0.5.1 asked. Recoverable through the reflog, so warn.
"core.git:branch-force-delete" = "warn"
# stash drop is warn by default in 0.15.3 (kept explicit so a default change cannot flip it).
"core.git:stash-drop" = "warn"

# --- Extra blocks for gaps found in the replay (same gaps exist in 0.5.1 and 0.15.3) --------
# These match the command text, so they can also hit a quoted mention. The reason says how to
# get past a false hit (allow-once).
[overrides]
block = [
  { pattern = '>>?\s*\S*\.config/secrets/', reason = "Writing into ~/.config/secrets is blocked. Use the secret-lookup skill to add or rotate a credential." },
  { pattern = 'git\s+push\b[^|;&\n]*\s(--delete|--mirror|-d)\b', reason = "git push --delete or --mirror removes remote refs. Ask Oystein first." },
  { pattern = 'git\s+push\b[^|;&\n]*\s:[A-Za-z0-9_./-]+', reason = "git push origin :ref deletes a remote ref. Ask Oystein first." },
]
