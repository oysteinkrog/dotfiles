# The user's own bin folders for programs the systemd user manager starts.
# herdr-core builds each terminal's "clean" environment from environment.d, so
# without this `hc run claude` found no `claude` and skipped aiolos-rc (2026-11-24).
# bin/herdr-shim comes first: its `claude` starts through aiolos-rc when herdr-core
# runs it, and runs the real binary for everything else.
# motioncatalyst-wine.conf sorts after this file and still puts Wine first.
PATH=${HOME}/bin/herdr-shim:${HOME}/bin:${HOME}/.local/bin:${PATH}
