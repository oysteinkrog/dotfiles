[Service]
# The daily run peaks at about 16 GiB (15.8 GiB on 11-22). Run without a cap it
# put jobd into pressure pause on 11-22. Capped at MemoryHigh=6G on 11-23 it
# pushed 9.7 GiB into swap and caused a pause anyway.
# So hand it to jobd like any big job: jobd starts it only when 12 GiB fits
# (measured peak 11 GiB on 11-24; 16 held the queue for 29 min),
# and counts it while it runs. The unit itself only waits for the job.
ExecStart=
ExecStart=/home/oystein/.local/bin/job submit --shared-cache --wait-timeout 14400 --est 12,4,330 -- /home/oystein/.config/tokscale/autosubmit/tokscale autosubmit run
TimeoutStartSec=6h
Nice=10
