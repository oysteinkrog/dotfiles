[Service]
# The daily run peaks at about 16 GiB (15.8 GiB on 11-22). Run without a cap it
# put jobd into pressure pause on 11-22. Capped at MemoryHigh=6G on 11-23 it
# pushed 9.7 GiB into swap and caused a pause anyway.
# So hand it to jobd like any big job: jobd starts it only when its estimate
# fits, and counts it while it runs. The unit itself only waits for the job.
# Measured 11-24 with "tokscale graph": 11.6 GiB in 97 s with all threads,
# 9.1 GiB in 130 s with RAYON_NUM_THREADS=4. So run it on 4 threads and ask
# for 11 GiB (an estimate of 16 held the queue for 29 min on 11-24).
ExecStart=
ExecStart=/home/oystein/.local/bin/job submit --shared-cache --wait-timeout 14400 --est 11,4,330 -- /usr/bin/env RAYON_NUM_THREADS=4 /home/oystein/.config/tokscale/autosubmit/tokscale autosubmit run
TimeoutStartSec=6h
Nice=10
