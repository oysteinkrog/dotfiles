# Reclaim protection for agent-mail. On 2026-10-24 it had 1.1 GiB in swap and only
# 0.36 GiB in RAM, and stalled 20 to 85% of the time on swap-in, which kept the
# pressure coordinator at "pause". MemoryLow=2G makes the kernel reclaim other cgroups first
# (peak use was 1.89 GiB). The protection only counts if every parent also has
# memory.low set: check app.slice.
[Service]
MemoryLow=2G
