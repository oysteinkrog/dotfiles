# Memory limits for agent-mail. On 2026-10-24 it had 1.1 GiB in swap and only 0.36 GiB
# in RAM, and stalled 20 to 85% of the time on swap-in, which kept the pressure
# coordinator at "pause" (peak use is about 1.9 GiB).
#
# MemorySwapMax is the limit that does the work: it keeps the working memory in RAM.
# MemoryLow has no effect today: the parent app.slice has memory.low 0 and the
# memory_recursiveprot mount option is off, so no protection reaches this unit. It is
# kept so it starts to count if app.slice gets a MemoryLow.
[Service]
MemoryLow=2G
MemorySwapMax=256M
