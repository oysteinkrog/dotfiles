# Protect the apps Oystein works in from reclaim by builds and agent sessions.
# Set at runtime on 2026-10-27 during a build memory spike: the terminal mux's
# memory stall fell from 17.7% to 0.05%. Made permanent 2026-10-28.
# 2026-10-30: 4G to 8G. App memory had grown to 7G and music in fooyin stuttered
# with 288 MiB swapped out. The root drop-ins (50-desktop-memprotect.conf) now
# grant 12G so session (4G) and app (8G) both get their full share.
[Slice]
MemoryLow=8G
