# Lets the MemoryMin of children such as frankenterm-mux.service take effect.
# memory.min only protects a cgroup as far as its parents also grant it, and
# user@1000.service has min 2 GiB, so 2G fits. Added 2026-11-11 with the mux
# reserve (frankenterm-mux.service.d/61-memory-min.conf).
[Slice]
MemoryMin=2G
