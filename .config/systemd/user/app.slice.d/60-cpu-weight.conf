# CPU weight for the apps Oystein works in (Chrome, frankenterm-gui, Claude
# desktop). Raised from the default 100 to 500 on 2026-10-22, so agent
# sessions (claude.slice, 80) and builds (builds.slice, 20) cannot crowd them out.
#
# Anything started with a bare `systemd-run --user` also lands here. Stress
# tests and benchmarks must not: they belong in builds.slice (heavy-build).
[Slice]
CPUWeight=500
