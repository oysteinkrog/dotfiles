# Hard reserve for the terminal mux, on top of MemoryLow=3G. Works only because
# app.slice also has a MemoryMin (app.slice.d/62-memory-min.conf); without that
# the kernel gives the mux an effective min of 0. Runtime test 2026-11-11 14:55
# to 15:55: mux swap-in 140/s to 24/s while the machine dropped only 36%.
# Oystein approved making it permanent on 2026-11-11.
[Service]
MemoryMin=1536M
