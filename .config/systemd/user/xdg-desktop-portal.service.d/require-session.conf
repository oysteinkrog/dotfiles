# Start the portal only inside a Plasma session. With linger on, something can
# D-Bus activate it at boot before login. It then runs without
# XDG_CURRENT_DESKTOP, never loads the KDE backend, and KRDP fails every
# connect with "Could not open a new remote desktop session" (home, 2026-10-30).
[Unit]
Requisite=graphical-session.target
