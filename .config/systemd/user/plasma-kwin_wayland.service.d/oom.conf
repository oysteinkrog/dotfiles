# Make the kernel OOM killer pick KWin last, after Chrome and builds (other
# user units get 200). A user manager cannot go below its own value (100, from
# user@1000.service), so 0 ends up as 100 until that is lowered as root.
# Takes effect on the next KWin start. Never restart KWin to apply it.
[Service]
OOMScoreAdjust=0
