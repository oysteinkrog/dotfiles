# herdr-core's server (hc-serve-<hash>.service, a transient unit in app.slice).
# Programs started with `hc exec` run inside this unit's cgroup. Herdr's sidebar
# probe runs `claude -p /usage` and `codex app-server` here every few minutes.
# The file cache they read was charged to this unit and grew to 12.7 GiB.
# app.slice's memory.low (meant for interactive apps) protected that cache, so
# the kernel took memory from builds and sessions first (manager-office, 2026-11-17).
# The server itself uses about 20 MiB, so a 2 GiB soft cap only trims that cache.
[Service]
MemoryHigh=2G
