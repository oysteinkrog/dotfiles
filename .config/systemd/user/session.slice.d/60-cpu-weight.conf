# CPU weight for the desktop session (kwin_wayland, Xwayland, plasmashell).
#
# 2026-10-22: raised from the default 100 to 1000 after the UI lagged at load
# average ~700. The weight only matters between sibling slices under
# user@1000.service: session 1000, app 500, claude 80, background 30, builds 20.
# When all of them want CPU, the session can take ~61% of it. It normally uses
# about 0.2 cores, so in practice it just runs first when it wakes.
#
# kwin_wayland's main, output (DP-*) and libinput threads are SCHED_RR (KWin
# sets that itself through cap_sys_nice), so CPU weight does not apply to them.
# It applies to plasmashell, Xwayland and KWin's other threads.
[Slice]
CPUWeight=1000
