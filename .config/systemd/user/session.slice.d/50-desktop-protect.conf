# Protects the desktop from build memory pressure, after the 2026-10-13
# freezes. MemoryMin keeps 2G of the session's memory safe from reclaim, and
# MemorySwapMax=0 keeps the session out of swap.
#
# 2026-10-20: MemoryLow=4G adds soft protection above the 2G hard floor. The
# session holds about 2.0G (kwin 0.65G, plasmashell 1.08G RSS). Neither value
# works unless every ancestor grants it: user.slice, user-1000.slice and
# user@1000.service need MemoryMin=2G and MemoryLow=4G too (root drop-ins in
# /etc/systemd/system, see /var/tmp/claude/manager/perf2-apply.sh). The
# cgroup2 mount has no memory_recursiveprot, so ancestors must grant explicitly.
[Slice]
MemoryMin=2G
MemoryLow=4G
MemorySwapMax=0
