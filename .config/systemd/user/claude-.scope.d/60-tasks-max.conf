# Task limit for every Claude Code session scope (claude-<pid>.scope, created by aiolos-rc).
# Oystein, 2026-11-06: a runaway script that re-ran itself forever reached 1,735 sh processes
# and 11 GiB of kernel slab. The cap stops a fork loop inside its own scope. Normal sessions
# stay under about 200 tasks. Do not set this on claude.slice: 50 sessions share it.
[Scope]
TasksMax=2000
