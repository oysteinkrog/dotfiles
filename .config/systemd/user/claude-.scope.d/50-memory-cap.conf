# Memory cap for every Claude Code session scope (claude-<pid>.scope, created by aiolos-rc).
# Approved by Oystein 2026-10-24 after a 53 GB runaway python in claude-7115.scope caused a
# global OOM at 12:55 and the kernel killed Slack, Chrome and Claude Desktop first. With a cap
# the runaway is killed inside its own scope. The largest session used about 8.4 GiB.
# MemorySwapMax is left alone (set in aiolos-rc and claude.slice). History: a per-session
# MemoryHigh=8G on 2026-10-09 swapped a session out while RAM was free (see claude.slice);
# 20G is far above normal use, so that should not recur. Revisit if a scope sits near 20G.
[Scope]
MemoryHigh=20G
MemoryMax=24G
