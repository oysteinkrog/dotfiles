# Keep jobd's own pages and its SQLite file in memory. Under swap-in of
# 3000 pages/s (2026-10-29 04:47 and 10:31) an admission pass took 6 to 11 s,
# almost all of it reading jobd.db back. jobd uses about 40 MB. A child's
# MemoryLow only counts when its parent slice has some too.
[Slice]
MemoryLow=256M
# 2026-11-11: MemoryMin=300M (with the same on jobd.service) keeps jobd's code
# and cache pages; MemoryLow alone did not. Oystein approved.
MemoryMin=300M
